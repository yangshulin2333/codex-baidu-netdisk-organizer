name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/baidu-netdisk-organizer
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/baidu-netdisk-organizer/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Build bundled MCP server
        run: npm run build
      - name: Verify committed bundle is current
        run: git diff --exit-code -- mcp/dist
      - name: Check PowerShell syntax
        shell: powershell
        run: >-
          Get-ChildItem scripts\*.ps1 |
          ForEach-Object { [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw)) }
